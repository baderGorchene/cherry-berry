services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cherry
      POSTGRES_PASSWORD: cherry
      POSTGRES_DB: cherry
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  # S3-compatible object storage (Apache-2.0). API on :9000, web console on :9001.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  # One-shot: creates the `cherry` bucket once RustFS is healthy.
  rustfs-init:
    image: rustfs/rc:v0.1.37
    depends_on:
      rustfs: { condition: service_healthy }
    restart: "no"
    entrypoint: >
      sh -c "rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
      rc bucket create --ignore-existing local/cherry"
volumes:
  pgdata:
  rustfsdata:
